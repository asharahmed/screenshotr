[package]
name = "screenshotr"
version = "0.1.0"
description = "Cross-platform screenshot hotkey override and uploader"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
anyhow = "1"
arboard = "3"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-types = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
keyring = "2"
rand = "0.8"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["api-all", "system-tray", "macos-private-api", "icon-png", "updater"] }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "multipart", "json"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
signal-hook = "0.3"
objc = "0.2"
cocoa = "0.24"

[features]
custom-protocol = ["tauri/custom-protocol"]
